generation:
  profile_version: "surface-v10"
  noise_probability: 0.075
  retry_limit: 250
  morphism_retry_limit: 40

  subjects:
    object: {1: 0.95, 4: 0.90, 7: 0.82, 10: 0.75}
    morphism: {1: 0.05, 4: 0.10, 7: 0.18, 10: 0.25}

  difficulty:
    recipe_family_weights:
      global: {1: 0.75, 4: 0.55, 7: 0.35, 10: 0.20}
      classification: {1: 0.20, 4: 0.30, 7: 0.35, 10: 0.40}
      path: {1: 0.05, 4: 0.15, 7: 0.30, 10: 0.40}
      relational: {1: 3.0, 10: 3.0}
      target-only: {1: 1.0, 3: 1.0, 10: 3.3333333333}
    polygon_count_weights:
      1: {1: 0.85, 4: 0.55, 7: 0.30, 10: 0.15}
      2: {1: 0.13, 4: 0.33, 7: 0.40, 10: 0.35}
      3: {1: 0.02, 4: 0.10, 7: 0.22, 10: 0.32}
      4: {1: 0.00, 4: 0.02, 7: 0.08, 10: 0.18}
    scalar_profiles:
      side_continuation: {1: 0.35, 4: 0.45, 7: 0.55, 10: 0.62}
      gluing_density: {1: 0.20, 4: 0.35, 7: 0.50, 10: 0.65}
      path_continuation: {1: 0.45, 4: 0.52, 7: 0.60, 10: 0.65}
      path_maximum: {1: 3, 4: 4, 7: 6, 10: 7}
      visual_budget: {1: 3.0, 4: 5.0, 7: 8.0, 10: 11.0}

  recipes:
    object:
      global:
        euler-characteristic: 1.0
        boundary-components: 1.0
        connected-components: 1.0
      classification:
        orientable: 1.0
        homology-groups: 1.4
      path:
        path-is-cycle: 1.0
        path-representative: 1.0
    morphism:
      relational:
        euler-change: 1.0
        boundary-change: 1.0
        component-change: 1.0
        map-injective: 1.0
        map-surjective: 1.0
        homology-isomorphism: 1.0
      target-only:
        target-homology: 1.0
        target-orientable: 1.0

  # Each object recipe selects a semantic outcome before any presentation is
  # constructed. Outcome weights form a joint distribution, so properties such
  # as path count and closure can be correlated without generator-side modes.
  object_laws:
    euler-characteristic: &ordinary_surface_law
      no-path: {weight: 0.925, component_count: 1, paths: {kind: none}}
      closed-incidental-path: {weight: 0.0375, component_count: 1, paths: {kind: distinguished, count: 1, first_closed: true}}
      open-incidental-path: {weight: 0.0375, component_count: 1, paths: {kind: distinguished, count: 1, first_closed: false}}
    boundary-components: *ordinary_surface_law
    connected-components:
      one-component: {weight: 0.35, component_count: 1, paths: {kind: none}}
      two-components: {weight: 1.0, component_count: 2, paths: {kind: none}}
      three-components: {weight: 0.25, component_count: 3, paths: {kind: none}}
    orientable: *ordinary_surface_law
    homology-groups: *ordinary_surface_law
    path-is-cycle:
      one-closed: {weight: 0.50875, component_count: 1, paths: {kind: distinguished, count: 1, first_closed: true}}
      one-open: {weight: 0.41625, component_count: 1, paths: {kind: distinguished, count: 1, first_closed: false}}
      two-first-closed: {weight: 0.04125, component_count: 1, paths: {kind: distinguished, count: 2, first_closed: true}}
      two-first-open: {weight: 0.03375, component_count: 1, paths: {kind: distinguished, count: 2, first_closed: false}}
    path-representative:
      nontrivial-representative: {weight: 1.0, component_count: 1, paths: {kind: nontrivial-homology}}
  morphisms:
    families:
      full-disk-boundary: {1: 0.35, 4: 0.18, 7: 0.06, 10: 0.02}
      attachment: {1: 0.35, 4: 0.30, 7: 0.20, 10: 0.15}
      partial-intercomponent: {1: 0.20, 4: 0.30, 7: 0.35, 10: 0.35}
      self-boundary: {1: 0.08, 4: 0.18, 7: 0.30, 10: 0.35}
      annulus-closure: {1: 0.02, 4: 0.04, 7: 0.09, 10: 0.13}
    affinity:
      euler-change: &neutral_morphism_affinity {full-disk-boundary: 1.0, attachment: 1.0, partial-intercomponent: 1.0, self-boundary: 1.0, annulus-closure: 1.0}
      boundary-change: {full-disk-boundary: 1.0, attachment: 1.0, partial-intercomponent: 3.0, self-boundary: 3.0, annulus-closure: 1.0}
      component-change: {full-disk-boundary: 2.0, attachment: 1.0, partial-intercomponent: 4.0, self-boundary: 1.0, annulus-closure: 1.0}
      target-homology: *neutral_morphism_affinity
      map-injective: {full-disk-boundary: 1.0, attachment: 4.0, partial-intercomponent: 1.0, self-boundary: 1.0, annulus-closure: 1.0}
      map-surjective: {full-disk-boundary: 1.0, attachment: 1.0, partial-intercomponent: 2.0, self-boundary: 2.0, annulus-closure: 2.0}
      homology-isomorphism: {full-disk-boundary: 1.0, attachment: 2.0, partial-intercomponent: 1.0, self-boundary: 2.0, annulus-closure: 2.0}
      target-orientable: *neutral_morphism_affinity

rendering:
  canvas:
    max_columns: 3
    cell_width: 360
    cell_height: 350
    margin_x: 48
    margin_y: 42

  geometry:
    side_length: 112
    curve_samples: 96
    curvature:
      edge_base: 32
      edge_step: 22
      interior_step: 64

  styles:
    - id: classic
      backend: matplotlib-svg
      weight: 1.0
      canvas_color: "#ffffff"
      palettes:
        - fill: "#f8f5ed"
          ink: "#263238"
          path_colors: ["#007c91", "#d97706", "#7e22ce"]
        - fill: "#e8f4f8"
          ink: "#164e63"
          path_colors: ["#be123c", "#00796b", "#6a1b9a"]
        - fill: "#fff1e6"
          ink: "#5d4037"
          path_colors: ["#1565c0", "#c62828", "#00838f"]
      stroke:
        polygon_width: 1.8
        path_width: 1.45
        vertex_size: 9
        dotted_pattern: [1, 2.6]
        sketch: null
        glow_layers: []
      arrows: &standard_arrows
        gluing_size: 18
        path_size: 13
        path_count_limit: 4
        spread_start: 0.22
        spread_end: 0.78
        tangent_span: 0.045
      labels: &sans_labels
        polygon_size: 13
        gluing_size: 10
        path_size: 11
        order_size: 9
        tag_offset: 20
        tag_clearance: 24
        gluing_offset: 19
        path_offset: 11
        font_family: "DejaVu Sans"
      grid: null

    - id: hand-drawn
      backend: matplotlib-svg
      weight: 1.0
      canvas_color: "#f3ead3"
      palettes:
        - fill: "#efe2bd"
          ink: "#302b27"
          path_colors: ["#315d73", "#a44a3f", "#6b5b2a"]
        - fill: "#e9d8ad"
          ink: "#40352c"
          path_colors: ["#365f46", "#9b4b32", "#57447a"]
      stroke:
        polygon_width: 2.2
        path_width: 1.65
        vertex_size: 13
        dotted_pattern: [0.8, 3.2]
        sketch: {scale: 1.2, length: 72, randomness: 2.4}
        glow_layers: []
      arrows: *standard_arrows
      labels: *sans_labels
      grid:
        spacing: 24
        color: "#8f7d5f"
        width: 0.35
        alpha: 0.08
        major_every: 4

    - id: blueprint
      backend: matplotlib-svg
      weight: 1.0
      canvas_color: "#073763"
      palettes:
        - fill: "#0b4a79"
          ink: "#d8f3ff"
          path_colors: ["#67e8f9", "#fef08a", "#f0abfc"]
        - fill: "#103f68"
          ink: "#effaff"
          path_colors: ["#93c5fd", "#fcd34d", "#f9a8d4"]
      stroke:
        polygon_width: 1.6
        path_width: 1.25
        vertex_size: 8
        dotted_pattern: [0.7, 2.2]
        sketch: null
        glow_layers: []
      arrows: *standard_arrows
      labels:
        polygon_size: 13
        gluing_size: 10
        path_size: 11
        order_size: 9
        tag_offset: 20
        tag_clearance: 24
        gluing_offset: 19
        path_offset: 11
        font_family: "DejaVu Sans Mono"
      grid:
        spacing: 18
        color: "#9edcff"
        width: 0.4
        alpha: 0.16
        major_every: 5

    - id: neon
      backend: matplotlib-svg
      weight: 0.75
      canvas_color: "#090611"
      palettes:
        - fill: "#151126"
          ink: "#72f1ff"
          path_colors: ["#ff4fd8", "#77ff66", "#ffd166"]
        - fill: "#10192b"
          ink: "#c4f5ff"
          path_colors: ["#00f5d4", "#f15bb5", "#fee440"]
      stroke:
        polygon_width: 1.7
        path_width: 1.35
        vertex_size: 10
        dotted_pattern: [0.8, 2.4]
        sketch: null
        glow_layers:
          - {width_factor: 6.0, alpha: 0.08}
          - {width_factor: 3.0, alpha: 0.16}
      arrows: *standard_arrows
      labels: *sans_labels
      grid: null
